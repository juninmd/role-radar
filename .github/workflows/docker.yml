name: Build and Push Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  docker:
    permissions:
      contents: read
      packages: write
    uses: juninmd/base-actions/.github/workflows/reusable-docker-build.yml@main
    with:
      # pacote ghcr.io/juninmd/role-radar já existe sem vínculo com este
      # repositório (repo: null), então o GITHUB_TOKEN não consegue publicar
      # nele (permission_denied: read_package). Um nome novo cria um pacote
      # automaticamente vinculado a este repo.
      image-name: ${{ github.repository }}-app
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
